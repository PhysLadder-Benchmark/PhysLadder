# Copy to gpt.toml (gitignored), then set your provider's API root and model ID.
# The client appends /responses. Include /v1 only if your provider requires it.
# Credentials belong in the OPENAI_API_KEY environment variable, never this file.
[gpt]
base_url = "https://your-provider.example/openai"
model = "gpt-6-astra"
api_key_env = "OPENAI_API_KEY"
timeout_s = 90.0
reasoning_effort = "low"
structured_output = true
history_steps = 2
max_calls = 6
image_max_edge = 768
