# Run in the Isaac Sim environment, using the configured shared model transport.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["right"] # Real skill LEFT (can0) is on overview RIGHT.

observation_arms = ["left"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[completion]
return_home = false

[task]
verbatim_instruction = true
prompt_source = "../prompts/feishu_english_20261014.json"
id = "L3-03"
name = "固定瓶身旋下瓶盖"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
launch_command = "python tools/launch.py run L3-03 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-03 --gui"
instruction = "Hold the bottle steady with the left arm, unscrew the cap with the right arm, then lift the cap 3–5 cm away from the bottle opening."

# Chinese setup/props description; final task attribute.
description = """
更新为方形东方树叶空瓶外观资产，竖直放两臂中间，瓶身按本轮要求固定；这是相对真机双臂扶瓶的明确简化。第三视角右臂（对应真机左臂）旋下预松瓶盖，第三视角左臂只观察；确认瓶盖完全脱离瓶口即成功，允许继续夹持，不额外要求提离30 mm或放桌。保持原7.5 mm/300°预松条件，不测试紧盖启动力矩。资产虽是空瓶外观，原生瓶身质量仍358 g，未认作实测空瓶质量。
确认完全分离即结束，不要求放下、释放或双臂回位。资产来源：飞书《GPT6评测任务及资产管理》2026-10-11下载包。
"""
