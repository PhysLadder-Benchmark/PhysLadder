# Run in the Isaac Sim environment, using the configured shared model transport.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["right"]
observation_arms = ["left"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[task]
id = "L3-11"
name = "抓取板擦擦除绿板字迹（清洁代理）"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
launch_command = "python tools/launch.py run L3-11 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-11 --gui"
instruction = """
Use the RIGHT arm to pick up the loose board eraser and erase the BLACK GPT6 writing
on the fixed green board. The LEFT arm is an observation arm: move its camera
when a grasp, contact face or remaining writing is hidden, without touching props.
Both hands start empty. The board lies horizontally on the table, rotated
180 degrees in its plane: GPT6 looks upside-down from the shared OVERVIEW
image, while the writing face stays upward. The eraser starts on its image-RIGHT
side on a low passive rest, with its cleaning pad facing down.
The rest exposes its sides so fingers can grasp without hitting the table.

Identify the plastic back, cleaning pad and usable sides. Pinch across the
50 mm width at the upper plastic side edges of the 100 x 50 x 18 mm eraser; its full 100 mm length cannot fit the
R5 opening. Avoid gripping so low that finger tips extend below the pad and hit
the board. Confirm that the eraser moves with the hand. Keep the cleaning PAD,
not the plastic back or gripper, against the board while moving across writing.
Use gentle contact and short strokes, then inspect the actual remaining marks.
If some marks remain, adjust the position/direction/contact before another pass.
Do not confuse a hidden area under the eraser with a clean area; move aside or
use the observation camera when needed.

Success is erasing at least 90% of the initial writing with grasped wiping
contact. No final eraser placement, gripper release, prescribed wiping path,
precise contact force or extra waiting period is required. This is a disclosed
cleaning proxy: measured eraser-pad contact and sliding remove visible ink cells.
Hovering over ink, hiding it, or touching with the wrong face will not erase it.
The interface offers pose and gripper commands with fixed drives, not a live
force-control tool. Use observations to verify progress before requesting stop.
"""

# Chinese setup and props; final task attribute.
description = """
道具：2026-10-08 原尺寸绿板（410×280 mm）、板擦（100×50×18 mm）和可见黑色 GPT6 字迹。绿板固定并在桌面内转 180°，从公共第三视角看字迹上下颠倒，书写面朝上；板擦单独放在右侧 25 mm 高的被动支座上、清洁面朝下，为夹指留空；两手空置。
操作：右臂自主抓取板擦，让清洁面接触并移动擦过字迹，观察残留后修正；左臂仅用于观察。
完成：有效接触擦除至少 90% 的初始字迹面积。不要求板擦放回指定位置、松手、等一秒或达到特定压力。
机制：等面积字迹小格仅在检测到板擦与板面接触、清洁面贴近该格并有实际横向移动时消除；画面残留与评分使用同一状态。
边界：刚性板擦、接触擦除代理，未模拟真实墨迹溶解、湿度、擦垫变形或压力—清洁效率关系；与原湿毛巾真机任务不同，不据此宣称完整真实 L3 清洁能力。
"""
