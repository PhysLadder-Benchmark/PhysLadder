schema_version = 2

[task]
id = "L1-03"
instruction = """
Use only the left R5 arm; keep the other arm still. Infer object locations and
orientations from the three RGB views. Choose all grasps and motion targets
yourself; reobserve and recover after missed grasps or rejected actions.
Lift every manipulated object at least {lift_m} m above its initial centre
while grasping it with both fingers for {grasp_hold_s} simulation seconds.
After completing the goal, sustain it for {stability_s} simulation seconds.
For tasks requiring release, open the gripper to 0.070 m and retreat at least
0.065 m clear of the object. Empty commands wait with the existing targets held.
Use small moves near contact. First open the gripper and choose an observation
or approach pose above the work area; align the tool before descending.
In sparse_eef, roll=pitch=yaw=0 points the fingers down; pitch=-90 keeps
them horizontal. Null angles preserve the measured orientation. Read the
measured state after preparation; choose positions from the images, not
from the original home pose.
Request stop only when the visible task requirements have been met.
"""

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left"]

[runtime]
seed = 0
max_steps = 2400
max_wall_time_s = 1800.0
physics_dt_s = 0.004166666666666667
control_dt_s = 0.08333333333333333

[observation]
cameras = ["overview", "left_wrist", "right_wrist"]
include_robot_state = true
include_feedback = true

[recording]
save_rgb = true
save_video = true

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
# Backend defaults to d3d12 on Windows and vulkan on Linux.
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.15, -1.3, 0.95]
camera_target = [0.28, 0.0, 0.20]

[execution]
max_action_steps = 120
completion_samples = 3
wait_steps = 12
settle_steps = 12
stop_steps = 12
max_decisions = 40
gripper_timing = "open_before_motion"
motion_mode = "cartesian_linear_v1"
startup_pose = "downward_ready_v1"
gripper_completion = "stall_aware_v1"

[policy]
model_config = "../models/gpt.toml"

[policy_options]
retain_text_history = true
operating_notes = true
action_interface = "sparse_eef"
camera_calibration = false
visual_aids = true

# Engineering defaults for l1-rigid-v1, not thresholds prescribed by Feishu.
[l1]
stability_s = 1.0
grasp_hold_s = 0.25
lift_m = 0.015
position_tolerance_m = 0.003
height_tolerance_m = 0.004
rotation_tolerance_rad = 0.14
position_jitter_m = 0.008
yaw_jitter_rad = 0.15
