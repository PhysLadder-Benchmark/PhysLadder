# Run from the repository root in the Isaac Sim environment; requires OPENAI_API_KEY.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.6, 0.0, 1.4]
camera_target = [0.28, 0.0, 0.20]

[policy]
model_config = "../models/gpt.toml"

[execution]
retry_failed_attempts = true

[task]
id = "L1-03"
name = "低阻力插头插接"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
simulation_limitations = "Rigid dummy connector; no cable, electrical continuity, retention spring or commercial connector fidelity."
launch_command = "python tools/launch.py run L1-03 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L1-03 --gui"
instruction = """
Use the LEFT R5 arm for manipulation. The RIGHT arm is an observation arm:
it may move its wrist camera when a grasp, opening or contact is obscured, but
must not touch or support the props. Keep the left arm steady while changing
view. Choose grasp points, poses and motion from current images and available
robot feedback; no object coordinates or successful action sequence is supplied.
Pick up the unpowered plug from the table and insert it into the matching
fixed socket. Use a low-insertion-force connector with no latch, screw or lock.
Initially the blue plug stands upright with its grey rectangular tongue pointing
downward. The fixed socket opens upward; both axes are vertical, but the parts
are separated on the table and not already aligned or engaged. This reduces
gross reorientation; it does not supply the final insertion pose.
Identify the blue graspable body, grey functional tongue, rectangular socket
opening and matching cross-section orientation. This is a rigid dummy connector;
there are no exposed pins or flexible cable. Grip the body without covering the tongue.
Open, approach, close, and verify a short lift before transporting the plug.
Carry the tongue clear of the socket rim, align its entire rectangular section
inside the opening, and lower approximately vertically. Account for the tongue's
offset from the TCP; do not align the TCP alone. If blocked, withdraw slightly
and inspect the mismatch before correcting rather than forcing a tilted tongue.
Insert the tongue tip at least 0.022 m below the rim, seat it gently on the socket
floor, and open the gripper separately. Withdraw without dragging the plug and
confirm it remains supported in the socket for 1.0 simulation seconds without
hand support. No power connection,
electrical test, latch actuation, cable routing or twisting operation is required.
Inspect the actual released or completed state before requesting stop. A
commanded pose, blocked gripper, or completion claim is not evidence of success.
If a grasp is lost or the scene resets, use new observations and reassess rather
than continuing with stale object positions. Do not invent force measurements
or assume a force-control tool that the interface does not expose.
"""

# Chinese setup/props description; keep this the final task attribute.
description = """
道具：带可抓持壳体和矩形插舌的未通电插头代理、固定空心插座、操作台。
布置：插头竖直放在桌面，与插座轴线平行；插舌为 22×14 mm，插口为 32×24 mm，排除锁扣与电气连接。
操作：左臂自主抓取、抬升、对准插口和送入；右臂仅用于主动观察。
完成：有真实抓持抬升记录，插舌方向和截面正确，舌尖入槽至少 22 mm，松手后由插座支撑并稳定 1 秒。
边界：这是宽松几何插接代理，不对应某一商业插头；不模拟通电、弹性端子、插拔寿命或损坏。
"""
