# Run from the repository root in the Isaac Sim environment; uses the selected model provider.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab_l1.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 4

[policy]
model_config = "../models/gpt.toml"

[task]
verbatim_instruction = true
prompt_source = "../prompts/feishu_english_20261014.json"
id = "L1-03"
name = "USB 充电器插入固定插线板"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
arm_selection = "real_prompt"
simulation_limitations = "Photo-proportional strip-left/charger-right layout; upright charger in native free-standing 20.8-g black storage base, no attachment; photo-estimated recess 10 mm deep with about 43 mm exposed housing, visual/collision geometry adapted together. Fixed native strip rotated horizontally, 0.55 mm minimum slot side clearance with native contact materials and 12 passive spring contact bodies from the 2026-10-10 correction. Housing fixed kinematically; no powered circuit or flexible cable; dimensions and layout are not calibrated."
launch_command = "python tools/launch.py run L1-03 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L1-03 --gui"
instruction = "Pick up the power adapter with the left arm and align its prongs with the socket holes closest to the left arm."

scene_context = "白色两脚充电头竖放右侧黑色凹槽托座，插脚朝下、上部外壳露出；托座自由放置。固定插线板位于左侧，长边横向，孔口朝上，线缆盘在后方。目标是中间蓝色双孔，左臂先将充电头拔离托座，再使两片插脚分别实际进入对应孔；只对准或仅进入一脚不算完成，不要求完全落座或通电。右臂仅用于补充观察、不接触物体。场景栏允许继续夹持，但本轮指令明确要求松爪撤离，因此本轮以释放并独立稳定为完成条件。"

# Chinese setup/props description; keep this the final task attribute.
description = "对齐飞书 2026-10-12 场景说明与当轮指令摘要，非完整真机系统提示词。白色两脚充电头竖放右侧黑色凹槽托座，插脚朝下、上部外壳露出；托座自由放置。固定插线板位于左侧，长边横向，孔口朝上，线缆盘在后方。目标是中间蓝色双孔，左臂先将充电头拔离托座，再使两片插脚分别实际进入对应孔；只对准或仅进入一脚不算完成，不要求完全落座或通电。右臂仅用于补充观察、不接触物体。场景栏允许继续夹持，但本轮指令明确要求松爪撤离，因此本轮以释放并独立稳定为完成条件。 评分依据实际进入、释放承托及指令要求的回位；除挂帽不额外等待外，稳定验证 1 s，允许 5 mm 位移、5 度倾斜变化，回位容差 0.05 rad / 0.05 rad/s。不要求最低抬升高度或额外 TCP 包络间距。这些是仿真验证容差，不是真机操作精度。"
