# Run from the repository root in the Isaac Sim environment; requires OPENAI_API_KEY.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.6, 0.0, 1.4]
camera_target = [0.28, 0.0, 0.20]

[policy]
model_config = "../models/gpt.toml"

[execution]
retry_failed_attempts = true

[task]
id = "L1-08"
name = "两个杯子宽松套叠"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Engineering dimensions and friction; not calibrated to physical props."
launch_command = "python tools/launch.py run L1-08 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L1-08 --gui"
instruction = """
Use the LEFT R5 arm for manipulation. The RIGHT arm is an observation arm:
it may move its wrist camera when a grasp, opening or contact is obscured, but
must not touch or support the props. Keep the left arm steady while changing
view. Choose grasp points, poses and motion from current images and available
robot feedback; no object coordinates or successful action sequence is supplied.
Stack one rigid cup into the other to form a stable two-cup stack. Use two
compatible, wide-mouth, handleless cups designed to nest loosely, not fragile
stemware or a tight press fit. Both cups start separately upright on the table,
open ends upward; neither starts held or already stacked. The lower cup stays
on the table and is not glued down.
Move the smaller RED cup into the larger BLUE cup; identify the blue opening
and both upright axes. Choose
a side grip that leaves the moved cup's lower portion free and does not trap the
fingers between the two rims. Confirm an actual lift before transporting it.
Keep the carried cup upright, move its base above the lower opening, align, and
lower gently until the lower cup supports it. Stop and realign if the rims catch;
do not force the walls together. Open in a separate decision, withdraw without
lifting the placed cup, and confirm the two-cup stack stands independently.
The red cup nests deeply inside the blue cup: its base should finish about
0.002-0.013 m above the blue cup's base, with their axes within 0.005 m horizontally.
Merely balancing the red cup on the blue rim is insufficient. No yaw angle around
the vertical axis is required for these unmarked rotationally symmetric cups.
Keep both cups upright, with the blue cup supported by the table and the red cup
supported by the blue cup. After release, observe them still for 1.0 simulation
seconds. Do not squeeze or deform them.
Inspect the actual released or completed state before requesting stop. A
commanded pose, blocked gripper, or completion claim is not evidence of success.
If a grasp is lost or the scene resets, use new observations and reassess rather
than continuing with stale object positions. Do not invent force measurements
or assume a force-control tool that the interface does not expose.
"""

# Chinese setup/props description; keep this the final task attribute.
description = """
道具：两个无柄刚性空心杯，下杯内口直径约 66 mm、高 60 mm，上杯较窄且高 73 mm。
布置：两杯分开正立在桌面，均未抓持，下杯不固定。
操作：左臂抓起较小上杯，保持正立，对准下杯口轻放套入；抓点需露出杯底且避免夹指夹在杯沿之间。右臂仅观察。
完成：上杯经过抓持抬升，套入后由下杯实际承重，双杯释放后保持正立、稳定 1 秒。
边界：宽松套叠，不是压装；无标记圆杯不要求绕竖直轴的特定角度。杯壁分片碰撞，杯口真实开放。
"""
