# Run from the repository root in the Isaac Sim environment; uses the selected model provider.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [0.21354960845762927, 0.48765041712220114, 1.32]
camera_target = [0.1643434123515941, 1.0254038459952994, 0.78]

[policy]
model_config = "../models/gpt.toml"

[task]
# Guided RGB-D execution; common information boundaries are appended by BenchTask.
prompt_protocol = "guided_rgbd_l2_v2"
scoring_protocol = "native_l2_validity_v2"
id = "L2-07"
name = "单臂拉开固定化妆抽屉"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Native organizer, 90 mm passive rail; explicit R5 grip tab, not original thin lip. Estimated physical properties."
launch_command = "python tools/launch.py run L2-07 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L2-07 --gui"
instruction = """
Approach the external grip from its exposed front, with a slightly downward
finger approach (about 15-35 degrees below horizontal), rather than placing
the wrist and camera directly above the cabinet roof. Close across the grip
width, then preserve this orientation while pulling. Choose the actual pose
from current images; check roof and camera clearance throughout.

Use the LEFT R5 arm to open only the UPPER drawer. The RIGHT arm is free to
move its wrist camera for observation but must not touch the organizer.
Identify the upper drawer, its blue external grip tab, and the rail direction
from current RGB-D observations. The cabinet and lower drawer are fixed.
The blue tab is an R5 grasp adapter; the original narrow lip is not a suitable
pinch target. Pinch across the tab's 40 mm width, keeping both finger pads
on opposite sides and avoiding the drawer panel and cabinet roof.

Approach with an open gripper and inspect from complementary views. Close in
a separate decision. A blocked close is not proof of capture: verify the tab
lies between the pads and check actual drawer movement during a short pull.
Do not test-lift a rail-constrained drawer. Preserve handle height and alignment.

Pull toward the robots along world +Y, using short movements and checking that
the drawer follows. The native rail has 90 mm total travel; aim for 75-85 mm.
There is no push latch or button. Do not force beyond the mechanical stop,
rotate the cabinet, lift the drawer, or move along the wrong axis.
If the grip slips, reobserve and regrasp rather than continuing an empty pull.

Once open at least 75 mm, release, withdraw without pushing it closed, and
observe approximately half a simulation second of released, nearly stationary
opening. No item retrieval or closing is required. Request stop only after
observing this physical result. Use available control feedback; do not invent
force sensors or a force-control API. No automatic scene reset is performed.
"""

# 中文布置和道具说明。
description = """
道具：L20 双抽屉收纳盒原生资产；柜体和下层抽屉固定，上层保留原生 90 mm 滑轨。原把手仅约 8 mm 高，另加蓝色 40 mm 宽抓持适配片，明确不是原照片把手。
布置：使用拓境实验室 R5 双臂与三路相机，桌高 0.78 m；抽屉正面朝机械臂（世界 +Y），左臂操作，右臂只观察。
操作与完成：夹住适配片，沿 +Y 拉开至少 75 mm，最大行程 90 mm；释放并保持开启约 0.5 秒。不取物、不关闭、不要求扶柜或抬升。
物理：保留原生尺寸、质量、材质及被动滑轨；适配片属于抽屉刚体，不与机器人吸附或绑定。源资产不修改。
"""
