# Run from the repository root in the Isaac Sim environment; uses the selected model provider.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["right"]
observation_arms = ["left"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[completion]
return_home = true
home_tolerance_rad = 0.05

[task]
verbatim_instruction = true
prompt_source = "../prompts/feishu_english_20261014.json"
# Guided visual execution; common information boundaries are appended by BenchTask.
prompt_protocol = "guided_visual_l2_v3"
scoring_protocol = "drawer_pull_return_v5"
id = "L2-07"
name = "预开抽屉拉出并推回"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Delivered cabinet fixed, lower drawer fixed; original upper rail and passive resistance retained. Five dynamic 20 mm cubes remain loose in the upper drawer. Friction and cabinet dimensions uncalibrated."
launch_command = "python tools/launch.py run L2-07 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L2-07 --gui"
instruction = "Use the left arm to pull the partially open top drawer out another 5 cm, then push it back to its original position."

# 中文布置和道具说明。
description = """
更新为白色收纳盒及上层5个自由蓝方块。整盒按真机照片放在画面最右侧，比上一版再向画面右移70 mm，保留向桌前移100 mm的间距，中心(0.55,1.12)m；允许柜体局部超出第三视角画面，需要时用腕部视角观察，不移动公共相机；保持原斜摆方向，原把手/开口朝机械臂一侧（画面左后方，世界-X/+Y），拉出时向机械臂靠近；柜体及下层固定，上层初开30 mm，总行程90 mm。右臂沿原滑轨再拉出约50 mm，然后推回本轮初始30 mm开度，松手；左臂观察。不加把手，不取出方块。返回开度容差8 mm，不要求毫米级配准。
所有道具按要求释放，并且双臂回到初始关节位置，才算完成；关节回位容差0.05 rad。不自动执行回位。资产来源：飞书《GPT6评测任务及资产管理》2026-10-11下载包。
"""
