# Run from the repository root in the Isaac Sim environment; uses the selected model provider.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab_table88.toml"
active_arms = ["left", "right"]
observation_arms = []

[simulation]
camera_position = [0.08473841088630307, 0.3224941470862603, 1.4085685642168073]
camera_target = [0.0799615301208277, 1.1759305583932784, 0.8873934753401892]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[runtime]
physics_dt_s = 0.0005208333333333333 # 1920 Hz; marker/box contact regression uses this step.

[completion]
return_home = false

[task]
table_revision = "159x79x88_20261013"
real2sim_profile = "feishu_l2_20261013"
# Guided visual execution; common information boundaries are appended by BenchTask.
prompt_protocol = "guided_visual_l2_v3"
scoring_protocol = "ordered_full_extraction_20261013_v1"
id = "L2-01"
name = "绿盒横置马克笔双臂拔帽"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
launch_command = "python tools/launch.py run L2-01 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L2-01 --gui"
instruction = "The capped marker lies horizontal on the shared 205 x 195 x 75 mm teal box. LEFT picks up the barrel with the cap still attached; lift both parts clear of the box and hold steadily. Then RIGHT grips the cap while LEFT retains the barrel and actively pulls axially toward image-right. Verify complete separation and keep both parts steadily held. A cap falling off during pickup is failure. No placement, release or return home is required. Native length 151 mm, barrel 16.4 mm, cap 17.6 mm. Both hands start empty; no object attachment. Detection uses 8 mm lift clearance, 0.25 s stable holds and 2 mm final axial gap; these are numerical tolerances, not measured real thresholds. Box dimensions are user-confirmed. Position is estimated from reference images; the box is fixed in simulation, with real fixation still unconfirmed."

# 中文布置和道具说明。
description = "The capped marker lies horizontal on the shared 205 x 195 x 75 mm teal box. LEFT picks up the barrel with the cap still attached; lift both parts clear of the box and hold steadily. Then RIGHT grips the cap while LEFT retains the barrel and actively pulls axially toward image-right. Verify complete separation and keep both parts steadily held. A cap falling off during pickup is failure. No placement, release or return home is required. Native length 151 mm, barrel 16.4 mm, cap 17.6 mm. Both hands start empty; no object attachment. Detection uses 8 mm lift clearance, 0.25 s stable holds and 2 mm final axial gap; these are numerical tolerances, not measured real thresholds. Box dimensions are user-confirmed. Position is estimated from reference images; the box is fixed in simulation, with real fixation still unconfirmed."

simulation_limitations = "Native free body/cap and four passive radial springs. Uncalibrated detent/friction surrogate. Five solid support colliders omit decorative grooves; a cap envelope is used only against this box, preserving native barrel/cap and finger contacts. Prior Sharpa fixed-body test is not R5 bimanual validation. No rigid attachment, material damage or active cap force assistance."
