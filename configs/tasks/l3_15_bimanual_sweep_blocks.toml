# Run in the Isaac Sim environment, using the configured shared model transport.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["right"]
observation_arms = ["left"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[task]
id = "L3-15"
name = "单臂持手刷扫方块入固定簸箕"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
launch_command = "python tools/launch.py run L3-15 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-15 --gui"
instruction = """
Use the RIGHT arm to grasp the small hand brush and sweep the TWO blue blocks
into the FIXED dustpan. The LEFT arm may move for observation but must not
manipulate anything. The dustpan is anchored with its entry lip at tabletop
level; do not grasp it, move it, or try to hold it with the other hand.
In the shared OVERVIEW IMAGE, the fixed pan is on the LEFT, the brush starts
on the RIGHT, and TWO blocks lie between them. The pan mouth faces right
toward the blocks and brush. Sweep from image-right toward image-left.

The blocks are 20 x 20 x 10 mm. The brush initially rests freely on a 25 mm
passive support that exposes its handle. Pinch ACROSS the handle's roughly
28 mm width rather than its 8 mm thickness. The wide brush head does not fit
the gripper. Verify the brush follows the hand before sweeping. Its bristles
extend forward in the handle plane; use them against the table and blocks.

Identify the pan's open straight lip and sweep toward and across it. Use short
strokes, inspect leftovers, and change brush contact and direction to bring
scattered blocks to the fixed opening. Keep the fingers and brush clear of the
pan side walls. Do not pick up or directly transport blocks with the grippers.

Success is both blocks inside the pan basket and supported by it after
actual brush use. A block on the handle, outside the lip or flying above it
does not count. The brush may remain held or be released safely; there is no
extra waiting period, required brush parking location or final orientation.
Check the collected state before requesting stop. Bristles are rigid contact
proxies, not elastic fibers.
"""

# Chinese setup/props description; final task attribute.
description = """
道具：原尺寸手刷、簸箕与 2 个 20×20×10 mm 蓝色方块；保留原几何和质量。
布置：簸箕固定在桌面，入口薄唇贴桌；不再需要第二只手扶簸箕。按第三视角，左边簸箕开口朝右，右边手刷朝向簸箕，两块位于两者之间；手刷放在 25 mm 被动支座上便于夹持，右臂持刷，左臂观察。
完成：实际持刷扫入后，2 块都位于簸箕篮内并由其承托。不要求最后放下刷子、精确朝向或额外等待；不能用夹爪搬块代替扫入。
边界：原生刷毛为刚性胶囊束，不模拟柔性刷毛、细尘或材料损坏；摩擦等物性仍为估计值。
"""
