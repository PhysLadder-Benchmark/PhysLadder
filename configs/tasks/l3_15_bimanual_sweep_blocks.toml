# Run in the Isaac Sim environment, using the configured shared model transport.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["right"]
observation_arms = ["left"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[completion]
return_home = true
home_tolerance_rad = 0.05

[task]
id = "L3-15"
name = "持刷扫两块入固定簸箕"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
launch_command = "python tools/launch.py run L3-15 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-15 --gui"
instruction = """
From overview: gray dustpan on LEFT, green box on RIGHT, brush leaning against the box's LEFT side with handle high and bristles down, TWO blue 20 mm cubes between pan and brush. The pan mouth faces RIGHT and is fixed. RIGHT picks the brush near its narrow upper handle, brings bristles to table height and sweeps both cubes through the thin lip. LEFT observes only and must not touch the pan. Do not move cubes with the gripper itself. Once both cubes rest inside the pan, put down the brush on the table or against the box and release.

Use current RGB views and measured robot feedback. First identify the objects and make a short plan, then execute and verify each physical subgoal. If an object did not follow the gripper, correct the grasp before continuing. Reobserve after contact; do not infer success from a commanded pose. There is no automatic grasp, reset, release or return-home action. The common completion instructions appended below are mandatory.
"""

# Chinese setup/props description; final task attribute.
description = """
按第二张图：灰色簸箕在画面左侧、口朝右；绿色盒在右侧，手刷自由斜靠盒左侧、柄高刷毛低；两颗20 mm蓝方块在两者之间错开。簸箕及绿盒固定。右臂自主拿刷将两块扫进簸箕，左臂只观察；两块受簸箕承托后，把刷子放到桌面或靠回盒边并释放。沿用原生刚性刷毛和簸箕碰撞，未模拟弹性刷毛。
所有道具按要求释放，并且双臂回到初始关节位置，才算完成；关节回位容差0.05 rad。不自动执行回位。资产来源：飞书《GPT6评测任务及资产管理》2026-10-11下载包。
"""
