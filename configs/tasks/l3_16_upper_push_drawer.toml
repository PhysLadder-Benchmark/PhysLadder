# Run from the repository root; uses the shared GPT/Codex model configuration.
# Launch commands are documentation and are never executed by the task loader.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.6, 0.0, 1.4]
camera_target = [0.28, 0.0, 0.20]

[policy]
model_config = "../models/gpt.toml"

[execution]
retry_failed_attempts = true

[task]
id = "L3-16"
name = "上层抽屉按压解锁、弹出与拉开"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
simulation_limitations = "Single opening cycle of a measured-stroke latch proxy and bounded passive ejector spring; no commercial heart-cam geometry, automatic re-latching, calibrated force, fracture or damage model. Lower drawer and cabinet stay fixed."
launch_command = "python tools/launch.py run L3-16 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-16 --gui"
launch_command_windows_from_wsl = "powershell.exe -NoProfile -Command '& \"D:/conda/envs/isaac51/python.exe\" tools/launch.py run L3-16 --gui'"
instruction = """
Use the LEFT R5 arm to open the UPPER drawer of the two-level small cabinet.
The upper drawer has a red front and a small green grasp tab. The lower blue
drawer is NOT the target and must remain untouched and closed. The cabinet
is fixed to the table with its drawer fronts already facing the robots (-X).
Do not rotate or reposition the cabinet. Both grippers start empty; nothing is pre-grasped.

The RIGHT arm is an observation arm. Move its wrist camera when the upper-front
gap, fingertip contact or green tab is obscured, leaving the left hand steady.
Do not touch or support any prop with the right hand. Use current RGB-D,
robot state and execution feedback; no force or latch-state sensor is supplied.

Plan and verify these stages: identify the upper drawer; press inward; withdraw
and observe passive pop-out; grasp the exposed tab; pull along the rail; release
and confirm stability. These are goals to achieve, not proof they have occurred.

The upper drawer starts shut and latched. Pulling outward without first pressing
cannot unlock it. Identify a broad area on its front panel BELOW the green tab.
Choose a gripper pose that can gently push the front along world +X without
touching the roof, separator or lower drawer. Approach from the front with
clearance, then make small inward moves. About 8-10 mm of actual inward drawer
travel arms the latch; the inward stop is 12 mm. Hold a completed press briefly.
Do not equate your commanded TCP travel with actual drawer compression. If the
hand moves but the panel does not, inspect contact and correct the approach.
Do not lift the drawer or use the free-object upward grasp verification here.

After the press, unload and withdraw along world -X toward the robots, clear of the spring's
pop-out path. Allow the simulator to advance with a wait decision if needed.
The short ejector spring should leave a visible gap of roughly 20-40 mm. It
does not perform the full pull. Verify that the drawer has actually popped
out while the left fingers are no longer touching it. A pressed panel, moved
hand or an earlier note does not prove release. If it stays flush, reassess
the upper panel and complete a careful press-and-release attempt before pulling.

Once pop-out is visible, locate the exposed green tab and choose a grasp that
can sustain a horizontal pull. The tab is 38 mm wide, within the gripper's
opening range. Approach with clearance and open fingers; close in a separate
decision, then use a small outward move to verify that the upper drawer follows.
For this rail-constrained prop, verify grip by horizontal following, not lifting.
Pull smoothly along world -X toward the robots, retaining the rail height and orientation. Use
shorter moves if it resists, slips or approaches the stop; correct alignment
instead of repeating larger pulls. Total outward travel from the initially
closed pose must reach at least 100 mm; the physical limit is 115 mm.

Full extraction in this task means opening to the rail end while the drawer
REMAINS SUPPORTED by its guides. Do not detach it, lift out the tray, move the
cabinet, remove contents, close it again or operate the lower layer. After
opening, release the tab and move clear. Observe that it stays open and nearly
still for at least one simulation second before requesting stop. The declared
gentle-motion limits are 0.35 m/s drawer speed and a 40 N per-finger engineering
contact threshold, not calibrated damage limits or live force readings.

If the scene resets, restart from current images and the closed upper drawer;
discard earlier assumptions about its latch state. Report only visible
evidence in the decision note. A final position or completion claim alone
cannot substitute for the press, released pop-out and grasped-pull sequence.
"""

# Chinese setup/props description; keep this the final task attribute.
description = """
道具：固定在桌面的双层小柜、上层红色抽屉及绿色抓持凸片、下层蓝色抽屉、滑轨与按压弹出机构代理。
布置：柜体固定，抽屉正面已朝向机械臂（世界坐标 -X），无需模型转动或搬动柜子；柜体留出向机械臂方向拉开的空间。操作对象是上层抽屉，初始关闭且锁止；下层固定关闭作为非目标层。双手初始为空。
分工：左臂操作，右臂可按需移动腕部相机观察上层缝隙、按压接触和抓持状态，但不接触道具。
操作：沿世界坐标 +X 向柜内按压上层面板约 8—10 mm，沿 -X 松开并退让，待弹簧弹出约 20—40 mm；再抓住露出的绿色凸片，沿 -X 滑轨方向拉开至少 100 mm，最大行程 115 mm。
完成：实际出现按压、无手接触的释放弹出、抓持拉开，最后松手并保持稳定 1 秒。抽屉始终留在滑轨上，无需拿出盒体或另行放置。
评分：独立记录按压、弹出和拉开过程，检查最终开度、释放、稳定性、轨道约束、速度及接触力代理阈值；初始关闭、直接拉、只弹出或直接给出最终位置均不算成功。
代理边界：按实际压入及回弹行程切换锁止约束，有限行程的被动弹簧提供弹出力；不根据 GPT 命令或评分传送抽屉。未重建商业锁扣的心形凸轮、材料形变或损坏；首版只测一次开启，不测推回自锁。尺寸和弹簧参数为未标定工程值。
"""
