instruction = "The RIGHT source cup contains exactly FIVE free 16 mm glass marbles, one of each delivered colour. The LEFT receiver starts empty. RIGHT lifts the source and pours into the receiver; LEFT observes only. Success requires all FIVE marbles settled entirely inside the receiver (5/5). Four is failure; no residue allowance. Use the native hollow cups, 80 mm high with 70 mm rim and 50 mm base; grasp the lower body from the side. Keep fingers, wrist and camera clear during tilting. All five received is the success condition; source placement and robot homing are not additional success gates. Receiver is a fixed fixture in this simulation. Marbles keep native sphere collision and glass material. Total source mass is approximately 40.81 g; material/contact parameters remain uncalibrated."

