# Run in the Isaac Sim environment, using the configured shared model transport.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["right"]
observation_arms = ["left"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[completion]
return_home = true
home_tolerance_rad = 0.05

[task]
id = "L3-14"
name = "夹爪推板擦入三角区"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
launch_command = "python tools/launch.py run L3-14 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-14 --gui"
instruction = """
Use RIGHT gripper exterior to PUSH the loose blue board eraser into the large triangular outline. LEFT observes. The eraser starts above-right of the outline in overview; target is below-left. Eraser 120 x 60 x 20 mm; target 320 x 280 mm. Do not grasp, lift or carry. The complete footprint must enter the outline on the tabletop; any in-plane orientation is allowed. Withdraw without moving it back out.

Use current RGB views and measured robot feedback. First identify the objects and make a short plan, then execute and verify each physical subgoal. If an object did not follow the gripper, correct the grasp before continuing. Reobserve after contact; do not infer success from a commanded pose. There is no automatic grasp, reset, release or return-home action. The common completion instructions appended below are mandatory.
"""

# Chinese setup/props description; final task attribute.
description = """
用新版蓝色板擦替换三角刚体，120×60×20 mm，清洁面朝下。初态在目标区右上方；桌面红色大三角区约320×280 mm，位于左下方，无碰撞。右夹爪直接推板擦，左臂观察；整个板擦投影进入目标区、仍由桌面承托且撤爪即可，不限制最终朝向，不能夹起搬运。
所有道具按要求释放，并且双臂回到初始关节位置，才算完成；关节回位容差0.05 rad。不自动执行回位。资产来源：飞书《GPT6评测任务及资产管理》2026-10-11下载包。
"""
