# Run in the Isaac Sim environment, using the configured shared model transport.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["right"]
observation_arms = ["left"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[task]
id = "L3-14"
name = "夹爪推三角块入宽容目标区"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
launch_command = "python tools/launch.py run L3-14 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-14 --gui"
instruction = """
Use the RIGHT gripper exterior to push the small BLUE triangular block into the
large GREEN triangular outline on the tabletop. The LEFT arm observes only;
move its wrist camera when necessary to see contact or a hidden edge.
In the initial shared overview, the block is ABOVE-RIGHT of the target, closer
to the robots; both triangle tips point toward the robots. The target is
below-left. These describe the initial scene, not the wrist coordinate axes.

The native block is 32 x 17 x 10 mm. The target is roughly 200 x 180 mm, much
larger than the block. It is a flat non-colliding outline, not a second object,
recess or physical guide. Any final in-plane orientation is acceptable.

Bring the fingers together and use the gripper exterior as a pusher. Approach a
side above table level and push horizontally in small increments. Do not pinch,
lift, carry or perform a grasp-verification lift. Inspect actual block movement
and use a new side contact if direction must change; withdraw before repositioning
instead of sweeping through the block. Keep the robot fingers clear of the table.

Finish when the WHOLE block lies inside the green triangle and rests on the
table following an actual push. Its centre alone being inside is not enough.
No exact centre alignment, matched orientation, gripper release or extra timed
wait is required. Check the actual final state before requesting stop.
"""

# Chinese setup/props description; final task attribute.
description = """
道具：原尺寸蓝色三角块（32×17×10 mm）和桌面绿色大三角线框（约 200×180 mm）。
布置：参考实拍关系：从公共第三视角看，三角块在目标区右上方、更靠近机械臂，目标区在左下方、更靠近相机；两个尖端均朝机械臂。线框无碰撞。右夹爪直接推动，左臂按需观察。
完成：实际推动后，整个三角块投影进入目标区且由桌面承托即可。不限制朝向、精确中心或额外等待，不要求夹爪最后松开；不能通过夹起搬运代替推动。
边界：这是明显简化的刚体平面推入任务，不能仅因编号 L3 就认定测到了复杂受力与接触联合调整。
"""
