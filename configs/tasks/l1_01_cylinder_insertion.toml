# Run from the repository root in the Isaac Sim environment; uses the selected model provider.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 4

[policy]
model_config = "../models/gpt.toml"

[task]
id = "L1-01"
name = "白板笔入固定纸杯笔筒"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Native photo-estimated marker and rigid ripple cup; flat barrel collider, fixed cup with delivered contact friction, 0.2 mm contact margin and four velocity solver iterations. Not hardware calibrated."
launch_command = "python tools/launch.py run L1-01 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L1-01 --gui"
instruction = """
Use the LEFT R5 arm for manipulation. The RIGHT arm is an observation arm:
it may move its wrist camera when a grasp, opening or contact is obscured, but
must not touch or support the props. Keep the left arm steady while changing
view. Choose grasp points, poses and motion from current images and available
robot feedback; no object coordinates or successful action sequence is supplied.
Get the capped marker standing upright on the table into the single fixed,
upright red-brown ripple paper cup used as a pen holder. Keep the cap on. The holder has
a broad, open mouth and a loose, low-resistance fit: this is not press fitting.
Identify the marker's upper graspable section, lower entering end, cup opening
from observations. Either end may enter; keeping the cap up is a suggested
approach, not a completion requirement. This cup is tall relative to the
marker: grasping the middle of the barrel may leave the fingers too low to
insert and open without striking the rim. Prefer a stable upper section with
substantial overlap against BOTH opposing finger pads, including the ribbed
body of the cap when that provides the needed clearance. The cap remains on
and is part of the same rigid marker in this simulation. Avoid pinching only
the very tip, a narrow edge or the cap/barrel seam. Centre the cylinder axis
in the finger gap and contact opposite sides at similar heights. Choose the
grip and release height from the actual marker-to-finger geometry, rather than
assuming that centring the TCP above the cup is sufficient.

Localize before approaching. Query depth at several clearly visible pixels
inside the marker's upper body or cap, avoiding silhouettes, grippers, overlays,
shadows and background. Use the current image's camera name and pixel dimensions.
A depth query returns the visible surface at that pixel, not an object identity
or the marker's centre. Compare the returned height with the known table height:
a point near the tabletop cannot locate the upper graspable body of an upright
marker. Do not keep that point's XY and merely replace its Z with a grasp height.
Recheck pixel selection and query a clearer wrist view if points are inconsistent.
Use multiple surface points, the visible cylinder and its stated diameter to
estimate its axis; distinguish a near surface from the centre of the finger gap.

Approach with an open gripper, then inspect before closing. Verify in two
complementary views that the chosen body section is physically between the
opposing finger contact surfaces, both laterally and in depth. A marker projected
between the fingers in one wrist image can still be behind or in front of them.
If that relationship is unclear, hold the left arm still and move the RIGHT
observation arm to a clear oblique or side view, then use its updated image.
Choose the left wrist orientation as needed; the initial zero-joint pose is not
a required grasp orientation. Keep the chosen entering end unobstructed.

Close in a separate decision. Compare measured opening with the marker diameter
and inspect the actual images. Reaching the minimum opening around a visibly
wider marker is strong evidence of an empty grasp, not a reason to squeeze harder.
A blocked close alone also does not confirm a grasp. If capture is plausible,
make a small vertical test lift within the allowed grasp-check limits and verify
that the whole marker follows the fingers rather than remaining on the table.
The marker remaining upright at its initial tabletop position immediately after
closing, before any lift, does not by itself prove failure. Confirm control of
the marker before choosing transport or release.
During the test lift, check for downward sliding relative to the finger pads.
If the grip is slipping but the marker remains held, correct the grip while
maintaining control. Do not intentionally put it back on the table and release:
once the marker has left the table, a released landing on the table is failure.
Knocking the initially standing marker down onto the tabletop is also failure.
The episode ends on such a failure; no reset or second attempt will follow.
Tilt in the air is allowed and by itself does not fail the task.

After an empty close or failed lift, open the gripper and inspect again. Discard
the failed grasp estimate, obtain fresh body-surface depth measurements and
cross-check the horizontal alignment in another view. Correct XY and, as needed,
height or orientation before closing again. Do not repeat open-close at the same
pose, or only vary Z, without new evidence that the marker is now inside the gap.
In your action note, state the observed mismatch and the correction being made;
do not describe the fingers as centred solely because they appear so in one image.

After a verified lift, carry with enough clearance for the whole marker and
fingers. Identify the cup's interior opening from complementary views; a depth
sample through the opening may hit the bottom rather than the mouth plane.
Account for the marker's offset from the TCP. Centering the TCP alone does not
ensure that the marker will enter the cup.

A controlled placement is a useful strategy, but neither a vertical trajectory
nor a particular angle or insertion depth is required. You may release above
the opening and let the marker drop in if the whole motion will clear the rim.
Either end may enter and the marker may lean against the inner wall. Choose the
release pose from the observed object and cup geometry, not an assumed grasp.
If the pen catches on the rim while still held, lift clear and correct alignment.
Do not continue a transport plan after losing the object.

Open in a separate decision, withdraw without dragging the marker, and observe
one simulation second of released cup support. Success requires an end genuinely
inside the cup and the marker supported by the cup, without finger or tabletop
support. Resting across the rim, remaining above the opening or merely reaching
a commanded TCP pose is not enough. There is no mandatory 40 mm insertion or
upright-angle threshold. A confirmed earlier test lift is useful feedback but
is not an extra scoring requirement. Dropping onto the table or off the table
ends this episode as a failure without resetting the props or robot.
There is no need to uncap, write, rotate a thread or apply a precise insertion force.
Inspect the actual released or completed state before requesting stop. A
commanded pose, blocked gripper, or completion claim is not evidence of success.
If a grasp is lost, use new observations and reassess rather
than continuing with stale object positions. Do not invent force measurements
or assume a force-control tool that the interface does not expose.
"""

# Chinese setup/props description; keep this the final task attribute.
description = """
道具：交付包中的黑色白板笔（高约 151 mm，笔身直径 16.2 mm，最大宽约 18 mm，质量估计 22 g）及波纹纸杯（高约 107.5 mm，内口径约 78.6 mm）。纸杯固定，用作收笔容器；不是实物笔筒标定模型。
布置：使用拓境实验室、原生 R5 双臂和三路相机。桌面世界高度 0.78 m。笔竖直放在左臂前方，空纸杯在旁边；左臂操作，右臂只可换视角，不能接触道具。
操作：自主选抓点并结合观测将笔送入杯内；允许倾斜、任一端入杯，也允许从杯口上方松手后落入。抓取与短抬核验是操作建议，不指定唯一入杯轨迹。
完成：笔的一端真正进入杯腔，由杯体承重、无夹指或桌面支撑，释放后位置、倾斜和承托持续稳定 1 秒；单纯绕笔轴自转不拒绝完成。笔身与笔帽分别按实际碰撞形状检查，沿用 1 mm 接触容差。不设置竖直角度或 40 mm 深度门槛，也不强制某种夹持过程。
失败：初始竖立在桌上不算失败；操作中离桌后掉回桌面、被碰倒躺到桌面或掉下桌面即失败结束。全程不自动复位重试。
适配：保留交付尺寸、材质和独立杯壁碰撞体；将笔身圆底胶囊碰撞体替换为与可见平底相符的圆柱，防止初始竖立失稳。杯体静/动摩擦沿用交付值，抓持保持基础摩擦；接触距离为 0.2 mm，速度求解迭代为 4，源 USD 不修改。尺寸、质量与摩擦均未真机标定。
"""
