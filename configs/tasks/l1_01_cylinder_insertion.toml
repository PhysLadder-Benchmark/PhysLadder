# 示例参数用于表达接口，不代表测试方案已经定稿。
schema_version = 2

[task]
id = "L1-01"
instruction = "抓起桌上的圆柱，将其插入对应孔中，然后松开夹爪，保持圆柱稳定。"

[task.parameters]
peg_radius_m = 0.01
peg_height_m = 0.04
radial_clearance_m = 0.0005
# TODO: initial pose ranges, friction, fixture dimensions, success thresholds.

[robot]
# R5 dual-arm platform; this task activates only the left arm.
profile = "../robots/r5.toml"
active_arms = ["left"]

[runtime]
seed = 0
max_steps = 100
max_wall_time_s = 120.0
physics_dt_s = 0.004166666666666667
control_dt_s = 0.1

[observation]
cameras = ["overview", "left_wrist", "right_wrist"]
include_robot_state = true
include_feedback = true

[recording]
save_rgb = true
