# Run from the repository root in the Isaac Sim environment; uses the selected model provider.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab_l1.toml"
# Baseline for this layout; task.arm_selection recomputes roles at each launch.
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 4

[policy]
model_config = "../models/gpt.toml"

[task]
verbatim_instruction = true
prompt_source = "../prompts/feishu_english_20261014.json"
id = "L1-01"
name = "白板笔入固定黑色陶瓷杯"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
arm_selection = "real_prompt"
simulation_limitations = "Feishu 2026-10-11 marker and black ceramic mug; front-view mug-left/marker-right photo-proportional layout. Mug stays fixed, with delivered friction and hollow segmented wall colliders; native marker body and cap colliders combined into one closed rigid L1 prop; internal cap springs disabled, 0.2 mm contact margin and four velocity solver iterations. Dimensions/layout are estimates, not hardware calibrated."
launch_command = "python tools/launch.py run L1-01 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L1-01 --gui"
instruction = "Pick up the thick marker with the left arm and place it in the wide-mouth cup, then release it."

scene_context = "带帽白板笔竖立在画面右侧桌面，黑色白内壁宽口杯位于左侧、杯口朝上、杯柄朝桌前，两者约相距 30 cm。杯固定，笔可自由移动，保持笔帽不拆。左臂操作，右臂仅提供观察、不扶杯；允许右臂为补充视角移动，完成后双臂回位。任一笔端真正进入主杯腔即可，不要求精密深度；按本轮提示词还需松爪撤离，使笔独立留在杯内。"

# Chinese setup/props description; keep this the final task attribute.
description = "对齐飞书 2026-10-12 场景说明与当轮指令摘要，非完整真机系统提示词。带帽白板笔竖立在画面右侧桌面，黑色白内壁宽口杯位于左侧、杯口朝上、杯柄朝桌前，两者约相距 30 cm。杯固定，笔可自由移动，保持笔帽不拆。左臂操作，右臂仅提供观察、不扶杯；允许右臂为补充视角移动，完成后双臂回位。任一笔端真正进入主杯腔即可，不要求精密深度；按本轮提示词还需松爪撤离，使笔独立留在杯内。 评分依据实际进入、释放承托及指令要求的回位；除挂帽不额外等待外，稳定验证 1 s，允许 5 mm 位移、5 度倾斜变化，回位容差 0.05 rad / 0.05 rad/s。不要求最低抬升高度或额外 TCP 包络间距。这些是仿真验证容差，不是真机操作精度。"
