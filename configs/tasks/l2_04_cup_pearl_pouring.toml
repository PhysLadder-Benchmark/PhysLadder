# Run at repository root. Native props, production GPT workflow, no scripted policy.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["right"]
observation_arms = ["left"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[completion]
return_home = true
home_tolerance_rad = 0.05

[task]
verbatim_instruction = true
prompt_source = "../prompts/feishu_english_20261014.json"
prompt_protocol = "guided_visual_l2_v3"
scoring_protocol = "cup_received_count_fixed_receiver_v2"
id = "L2-04"
name = "纸杯间倒珍珠"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Existing rigid paper cups: no crushing. Receiver fixed to the table; source remains dynamic. Native hollow colliders; 200 native 8 mm pearls, approximately half-height fill, with outer-sphere collision and explicit 0.03 friction. Estimated physical parameters, not real trial calibration."
launch_command = "python tools/launch.py run L2-04 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L2-04 --gui"
instruction = "Pick up the left cup with the left arm, pour its contents into the right cup, then place it back and release it."

# 中文布置、道具和判据；不属于额外的模型输入。
description = """
道具：复用现有波纹纸杯原生资产两只、8 mm 小珍珠 200 颗。纸杯约高 108 mm，底部直径 56 mm，杯口 85 mm；每杯 14 g，200 颗珍珠合计约 61.79 g，装料杯约 75.79 g。杯体保留原生中空碰撞，不使用可压瘪版本；珍珠保留外观和质量，碰撞采用外球面，摩擦系数明确为 0.03。
布置：拓境实验室 R5 双臂与三路相机，以公共第三视角为准，右侧杯装料、左侧杯为空的固定接收杯，中心相距 200 mm；装料杯靠近画面右臂；接收杯固定在桌面，不滑动、不倾倒，源杯保持可抓取和移动。右臂从右往左倾倒，左臂仅在遮挡时移动观察，并留在倾倒操作区之外，无需扶杯。初始珍珠顶面距杯底约 54 mm，约占有效杯腔高度的 48%，静置后会重新堆积；此处“半杯”指料面高度，不指珍珠实体体积。保留杯口余量，避免满杯搬运。
抓取：R5 最大开口 70 mm，不能包住 85 mm 杯口；全开后从侧面略朝下接近，夹在距杯底约 40 mm 处（直径约 67 mm），检查夹指与桌面净空，再短距离试提确认。无吸附、无抓取绑定、不另加把手。
倾倒：先在接收杯外抬高，源杯杯口中心初始高于接收杯口约 150 mm，检查腕部、完整夹指和支架的净空；增加倾角时同步平移 TCP，尽量围绕倒料杯口转动，避免固定低 TCP 原地转腕。珍珠离口后仍向前运动，源杯口可偏向来料侧，依据实际落点修正，不能仅将两杯中心对齐；流束越过远侧杯沿时先减小倾角停流，再后移调整。没有出料可继续逐步倾至水平或略超过水平，不能只在小倾角反复等待。该高度和角度是操作建议，不是评分条件。
成功：提示目标仍为 160/200 颗；独立评分沿用至少 10 颗的宽容验收，不提高要求。先实际抓起装料杯，再让珍珠落入固定接收杯并停留；源杯放回任意空桌面并松手，竖立、独立受桌面支撑约 0.5 秒。接收杯校验固定位置，不要求其产生桌面支撑力读数。允许少量残留，不要求零洒落；报告实际接收、残留、杯外及曾洒落数量，不能把本任务成功解释为全部转移。
参考：真实杯间倒珍珠流程；当前 v8 仅调整左右布局、操作臂及对应方向提示，保留 200 颗和既有验收阈值；不与旧布局回合混合统计。
"""
