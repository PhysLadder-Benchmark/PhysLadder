# Run from the repository root in the Isaac Sim environment; requires OPENAI_API_KEY.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.6, 0.0, 1.4]
camera_target = [0.28, 0.0, 0.20]

[policy]
model_config = "../models/gpt.toml"

[execution]
retry_failed_attempts = true

[task]
id = "L1-05"
name = "钥匙插锁（柄部外露）"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
simulation_limitations = "Enlarged flat dummy key/keyway; no lock tumblers or unlocking mechanism."
launch_command = "python tools/launch.py run L1-05 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L1-05 --gui"
instruction = """
Use the LEFT R5 arm for manipulation. The RIGHT arm is an observation arm:
it may move its wrist camera when a grasp, opening or contact is obscured, but
must not touch or support the props. Keep the left arm steady while changing
view. Choose grasp points, poses and motion from current images and available
robot feedback; no object coordinates or successful action sequence is supplied.
Pick up the key by its exposed bow and insert its shaft into the fixed lock.
The key initially stands with its blade in a shallow open source cradle. The
yellow bow protrudes above the cradle so both fingers can reach it without
scraping the table. The support does not glue,
clamp or attach the key. The lock and key start separate; the key is not engaged.
Identify the yellow bow, grey rectangular blade, matching lock opening and
required insertion direction. Choose a grip on the exposed bow, leaving the
shaft unobstructed. Confirm the key lifts freely from the support before moving.
Bring the shaft in line with the keyway, match its orientation and advance in
small steps. If the tip catches, back off and correct alignment rather than
forcing it. Use the observation arm when the narrow opening is hidden.
Insert the blade tip at least 0.028 m below the target keyway rim without turning
the key. Align the full blade cross-section, not just the TCP. Keep the lock fixed
and the inserted key steady for 1.0 simulation seconds at completion.
This is insert-only: unlocking, door motion,
regrasping another tool and transferring the key between hands are not required.
The hand may continue holding the bow at the final inserted state; do not add a
release requirement unless the final task protocol explicitly requires it.
Inspect the actual released or completed state before requesting stop. A
commanded pose, blocked gripper, or completion claim is not evidence of success.
If a grasp is lost or the scene resets, use new observations and reassess rather
than continuing with stale object positions. Do not invent force measurements
or assume a force-control tool that the interface does not expose.
"""

# Chinese setup/props description; keep this the final task attribute.
description = """
道具：刚性钥匙代理、使钥匙柄外露的起始支架、固定矩形锁孔、操作台。
布置：钥匙功能端置于矮支架中，柄部伸出便于夹取；目标锁孔与钥匙轴线平行。柄厚约 23 mm，插舌截面 10×18 mm，锁孔 18×28 mm。
操作：左臂自主抓住柄部、取出、调整功能端和锁孔相对关系，插入规定深度；右臂可换视角。
完成：实际抓起过钥匙，插舌端入目标锁孔至少 28 mm、截面方向正确并稳定 1 秒；不要求转动，也不强制松手。
边界：只模拟宽松钥匙几何插入，没有弹子、开锁或精密齿形配合，不宣称对应特定实物锁。
"""
