# Run from the repository root in the Isaac Sim environment; requires OPENAI_API_KEY.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.6, 0.0, 1.4]
camera_target = [0.28, 0.0, 0.20]

[policy]
model_config = "../models/gpt.toml"

[execution]
retry_failed_attempts = true

[task]
id = "L3-14"
name = "持工具推 T 形块定姿"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Rigid frictional planar pushing. L3 interpretation requires analysis of contact changes; simple geometric success alone does not prove force-adaptation ability."
launch_command = "python tools/launch.py run L3-14 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-14 --gui"
instruction = """
Use the LEFT R5 arm for manipulation. The RIGHT arm is an observation arm:
it may move its wrist camera when a grasp, opening or contact is obscured, but
must not touch or support the props. Keep the left arm steady while changing
view. Choose grasp points, poses and motion from current images and available
robot feedback; no object coordinates or successful action sequence is supplied.
Pick up the pushing tool and use it to align the rigid T-shaped block with
the T-shaped target outline marked on the tabletop. The outline is flat and
nonblocking: it is not a recess, slot or fixture that guides the block for you.
The block starts flat, with a position and orientation different from the target.
The tool starts separately on the table and is not pregrasped.
Identify the tool handle and working end. Establish and verify a stable tool
grasp, then inspect the block, its crossbar and stem, and the target orientation.
Push the block through the tool only; do not directly grasp, lift or carry it.
Choose contact points and pushing directions that produce the required translation
and rotation. After each push, inspect actual sliding, rotation and contact loss,
then update the next contact point, direction, pose and motion increment.
Do not continue pushing at a stale location after the block rotates. Keep the
block flat and on the table, the tool grasp stable and the motion controlled.
Finish with the block's centre within 0.012 m of the green T footprint's centre
and yaw within 12 degrees of that footprint. Keep the block flat and supported
by the table. Retain the tool in the LEFT gripper and withdraw its head clear
of the block; do not set the tool down before completion. Confirm the block
remains still in its target pose for 1.0 simulation seconds without tool contact.
Neither gripper may touch the T block directly, even to make a small correction.
Inspect the actual completed state before requesting stop. A
commanded pose, blocked gripper, or completion claim is not evidence of success.
If a grasp is lost or the scene resets, use new observations and reassess rather
than continuing with stale object positions. Do not invent force measurements
or assume a force-control tool that the interface does not expose.
"""

# Chinese setup/props description; keep this the final task attribute.
description = """
道具：红色刚性 T 形块、蓝柄绿头刚性推具、桌面绿色 T 形目标轮廓。
布置：T 块带平移和朝向偏差，工具放在桌面，目标只是无碰撞视觉标记。
操作：左臂自主抓工具，用工具接触 T 块的不同部位，逐步推动和平转至目标；右臂观察，不能直接搬动或扶住 T 块。
完成：有抓起工具及工具实际推动接触记录，位置误差小于 12 mm、朝向误差小于 12 度，T 块正立稳定；工具保持抓持但已脱离物体，禁止夹爪直接接触搬运 T 块。
边界：保留接触过程与力记录；若实验只体现几何对准、无需受力联合调整，应如实降级描述，不因任务编号为 L3 就认定验证了 L3 能力。
"""
