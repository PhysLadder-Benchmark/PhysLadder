# Run from the repository root; uses the shared GPT/Codex model configuration.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.25, 0.0, 0.54]
camera_target = [0.71, 0.0, 0.0]

[policy]
model_config = "../models/gpt.toml"

[task]
id = "L3-14"
name = "夹爪推 T 形块定姿"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Rigid planar gripper pushing with relaxed target containment. Geometric success alone does not prove force adaptation or L3-level continuous joint adjustment."
launch_command = "python tools/launch.py run L3-14 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-14 --gui"
instruction = """
Use the LEFT R5 arm for manipulation. The RIGHT arm is an observation arm:
it may move its wrist camera when a block edge, target outline or contact is obscured, but
must not touch or support the props. Keep the left arm steady while changing
view. Choose contact points, poses and motion from current images and available
robot feedback; no object coordinates or successful action sequence is supplied.
Use the LEFT gripper itself to push the red rigid T-shaped block into the larger
green T-shaped outline on the tabletop. There is no separate pushing tool.
The green outline is a flat, non-colliding visual boundary, not a second block,
recess or physical guide. It is expanded by 20 mm on each side of the original T:
the target spans about 140 by 140 mm, while the block spans 100 by 100 mm.
The block is 26 mm tall and starts flat with a position and orientation offset.

Plan, execute and verify: inspect the red T's crossbar and stem and the green
outline; choose a side contact; push in short increments; correct translation
and rotation as needed; withdraw and check stable completion. Keep the fingers
together before approaching so the gripper's exterior acts as a pusher.
Contact a side face at a height that pushes the block horizontally while keeping
the fingers clear of the table. Do not straddle and clamp the block, lift it,
carry it, or perform an upward grasp-verification move. Nothing must be grasped.

Use current RGB-D and the wrist views to choose contact points that produce the
required sliding and rotation. Approach a side from free space, push a short
distance, inspect the actual result, then withdraw before moving to another side.
Do not sweep the hand through the block when changing contact points. If the
hand moves but the block does not, reassess contact and height instead of assuming
progress. If it overshoots or rotates, choose the next contact from its new pose.
Keep the block flat and on the table. The right arm may observe but may not push.

Finish when the ENTIRE red T footprint fits inside the green boundary, with its
crossbar and stem facing the same general direction as the target (yaw error at
most 25 degrees). The centre being inside is insufficient if an edge protrudes.
Exact coincidence with the centre or outline edges is unnecessary. Once it fits,
withdraw the left gripper clear and confirm that the block stays flat, supported
by the table and nearly still for 1.0 simulation seconds with neither hand touching.
Inspect the actual completed state before requesting stop. A
commanded pose, blocked gripper, or completion claim is not evidence of success.
Brief incidental contact or tipping is recorded and may be corrected by
pushing. Sustained grasped carrying or using the observation arm to manipulate
the block violates this task; the final block must rest flat on the table.
If contact is lost, use new observations and reassess rather
than continuing with stale object positions. Do not invent force measurements
or assume a force-control tool that the interface does not expose.
"""

# Chinese setup/props description; keep this the final task attribute.
description = """
道具：一块红色刚性 T 形块、桌面绿色 T 形线框；无额外推具。
布置：T 块约 10×10 cm、高 2.6 cm，初始有平移和朝向偏差；目标按原 T 形每侧外扩 2 cm，整体约 14×14 cm，只画绿色外边线，无碰撞、无引导凹槽。
操作：左臂先将空夹爪合拢，以夹爪外侧直接接触块的侧面，分段推动并调整接触点，使其平移和转向；不得夹住提起或搬运。右臂按需观察，不接触物体。
完成：有左夹指实际接触并推动块的过程记录，整块投影进入放大的 T 形轮廓，朝向误差不超过 25 度；夹爪退开后，物体由桌面支撑并稳定 1 秒。不再要求原先 12 mm 的中心对齐，也不再有工具抓取要求。
边界：保留接触过程与力记录；若实验只体现几何对准、无需受力联合调整，应如实降级描述，不因任务编号为 L3 就认定验证了 L3 能力。
"""
