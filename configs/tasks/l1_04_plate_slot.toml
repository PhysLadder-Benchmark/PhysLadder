schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[task]
id = "L1-04"
instruction = """
Use the left R5 arm for manipulation. The right arm may move only to improve
its wrist-camera view; it must not touch, grasp, push or support task objects.
Choose object locations, grasp regions, poses and actions from the observations.
Completion requires each manipulated object to have been lifted at least
{lift_m} m above its initial centre while grasped by both fingers for at least
{grasp_hold_s} simulation seconds. The final goal must remain stable for
{stability_s} simulation seconds. When release is required, the final gripper
opening must be at least 0.060 m, with no finger contact and at least
{retreat_m} m clearance between the TCP and the object.
"""

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
# Backend defaults to d3d12 on Windows and vulkan on Linux.
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.15, -1.3, 0.95]
camera_target = [0.28, 0.0, 0.20]

[policy]
model_config = "../models/gpt.toml"

# Engineering defaults for l1-rigid-v1, not thresholds prescribed by Feishu.
[l1]
stability_s = 1.0
grasp_hold_s = 0.25
lift_m = 0.015
position_tolerance_m = 0.003
height_tolerance_m = 0.004
rotation_tolerance_rad = 0.14
position_jitter_m = 0.008
yaw_jitter_rad = 0.15
