# Run from the repository root in the Isaac Sim environment; uses the selected model provider.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["left"]
observation_arms = ["right"]

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
gpu_dynamics = true # Native volume FEM requires GPU physics, not just GPU rendering.
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[orange_physics]
# Engineering FEM contact qualification, not measured orange tissue properties.
# Original asset: 35 kPa and dynamic friction 0.45. Mass and mesh stay native.
youngs_modulus_pa = 100000.0
dynamic_friction = 2.0
contact_offset_m = 0.003
rest_offset_m = 0.0015

[policy]
model_config = "../models/gpt.toml"

[runtime]
physics_dt_s = 0.004166666666666667 # 240 Hz, checked in the complete metre-scale laboratory.

[task]
# Guided RGB-D execution; common information boundaries are appended by BenchTask.
prompt_protocol = "guided_rgbd_l2_v2"
scoring_protocol = "soft_pedestal_lift_v6"
id = "L2-06"
name = "从圆柱承台夹起橘子瓣 5 厘米"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
simulation_limitations = "Native GPU FEM orange on a fixed native cylindrical pedestal. Engineering Young modulus 100 kPa and dynamic friction 2.0, not real tissue calibration. Goal: held 50 mm centroid rise from initial rest; no transfer/release/dwell or damage threshold. No attachment or automatic lift."
launch_command = "python tools/launch.py run L2-06 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L2-06 --gui"
instruction = """
Use the LEFT R5 arm to grasp the orange segment resting on top of the fixed
round pedestal centred between both arms and lift the segment at least 5 cm above its initial position.
Keep it held there and request stop. There is no transport destination or
placement stage: do not put it down, release it, or wait for an extra interval.
The RIGHT arm may move its wrist camera to observe, but must not touch or support
the orange or pedestal.

The pedestal is 13 cm high with a flat top about 6.8 cm across. The orange is
about 50 mm long, 26 mm wide and 17 mm thick, about 9 g. It lies flat with its
long axis pointing front/back in the overview (world Y), not across the image.
Choose a balanced grasp
across the fuller middle, not the pointed ends. Use RGB-D and complementary views
to put the orange between the inner finger pads, with adequate overlap on both
sides; avoid hitting the pedestal. The TCP is not the lowest point of the fingers.

Close firmly. Elastic squeezing is allowed, and you may use the full 12-70 mm
opening range. Do not stop closing merely because the pads touch or the orange
deforms. There is no direct force command: a smaller target opening increases
closure. If it slips during a short test lift, let the pedestal support it, close
further and retry; correct the grasp if the pads miss the sides. Reopening fully
is only needed to reposition. No soft-body damage threshold is imposed.

Confirm that the ORANGE follows the hand. Raise it about 7 cm to comfortably
clear the 5 cm goal despite small settling within the grip. Judge height relative
to its original position on the pedestal, not relative to the tabletop; moving
an empty gripper does not count. Once the held orange has risen at least 5 cm,
stop without an additional transfer, release or stabilization action.
"""

# 中文布置和道具说明。
description = """
道具：原生 GPU FEM 橘子瓣，约 50×26×17 mm、质量约 8.855 g；2026-10-09 新圆柱承台，高 130 mm、平顶直径约 68 mm，原生质量 313.9 g。承台固定在双臂中间的桌面，中心为实验室坐标 (0.19565, 1.30) m，橘子置于顶面中部，绕竖直轴旋转90°，长轴沿世界Y、第三视角画面纵向；仍保持宽面平放，不把薄边立起。取消绿色目标区。
任务：双手空手开始，左臂抓住橘子并向上提起，右臂可观察但不参与操作。相对本回合初始静置位置，橘子整体中心上升至少 50 mm，已离开承台且仍位于左夹爪双指之间即成功。初始垫高的 130 mm 不计入抬升；只抬空爪或弹飞不算抓起。
完成后保持拿着即可，不搬运、不松手、不要求额外等待、指定方向、速度或形变阈值。允许用力夹持、弹性挤压以及夹持不稳后继续收紧；掉到桌面可以重抓，无自动复位。
物性：保持原网格、尺寸、质量与 100 kPa 弹性模量；动摩擦由上一版 0.9 提高到 2.0（原资产为 0.45）。接触/静止余量 3/1.5 mm，240 Hz。仅覆盖运行场景并记录，不修改源资产，不声称这些是实测橘子物性。
评价版本：soft_pedestal_lift_v6，和旧绿色区域搬运任务分别统计。形变及局部网格反转只作诊断；非有限读数属于仿真故障，不当作模型任务失败。物体不绑定夹爪，运动由真实 FEM 接触产生。
"""
