# Run from the repository root in the Isaac Sim environment; requires OPENAI_API_KEY.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_bimanual_sim.toml"
active_arms = ["left", "right"]

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.6, 0.0, 1.4]
camera_target = [0.28, 0.0, 0.20]

[policy]
model_config = "../models/gpt.toml"

[execution]
retry_failed_attempts = true

[task]
id = "L2-03"
name = "三本书中层抽取与上层支撑"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Engineering dimensions and friction; not calibrated to physical props."
launch_command = "python tools/launch.py run L2-03 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L2-03 --gui"
instruction = """
Both R5 arms may manipulate the props; neither is restricted to observation.
Use the overview and both wrist-camera views. Choose grasp points, poses and
motion from current observations and available robot feedback. Verify that
objects actually follow the grippers before transport. Plan motions that keep
the hands and held props clear of one another.
Remove the middle book from a three-book stack while supporting the upper
book. The stack rests on support blocks beneath the bottom book. All books and
support blocks start stationary and ungrasped. Use rigid book-shaped props for
the first simulation version; preserve their realistic relative sizes.
Identify the middle book, the upper load, accessible edges and the extraction
axis. Use one hand to establish stable support for the upper book, and the other
to grasp the exposed edge of the middle book without pinching adjacent books.
Confirm support before pulling. Keep these primary contact roles stable while
coordinating a gradual horizontal extraction with the support motion.
Watch for upper-book tilt, slipping, drag on neighboring books and motion of the
bottom supports. Pause or correct alignment and loading when those conditions
appear; do not yank the middle book free. After complete extraction, place the
middle book on a free tabletop area and lower the supported upper book onto the
remaining stable stack or agreed support surface. Release only after support.
Completion requires the middle book removed and stably placed, with the upper
book never falling onto the table or losing stability during extraction.
Inspect the actual released or completed state before requesting stop. A
commanded pose, blocked gripper, or completion claim is not evidence of success.
If a grasp is lost or the scene resets, use new observations and reassess rather
than continuing with stale object positions. Do not invent force measurements
or assume a force-control tool that the interface does not expose.
"""

# Chinese setup/props description; keep this the final task attribute.
description = """
道具：三本 140×56×25 mm 的刚性书本代理，两块矮支撑物、操作台。
布置：三本书堆叠在支撑物上，红色中层书向前突出便于抽取；绿色上层书由中层承托，未预抓持。
操作：双臂配合，一臂稳定或托住上层书，另一臂夹取并抽出中层书，随后将两本书稳定放在桌面。
完成：中层完全抽出时保留上层支撑证据；此前上层不落桌或翻倒，最终两本书均放好、底层保持稳定。
边界：书本作为刚体，没有软封面、书页和弯曲；阻力来自实际接触摩擦，不添加外部调阻装置。
"""
