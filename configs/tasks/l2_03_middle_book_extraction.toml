# Run from the repository root in the Isaac Sim environment; uses the selected model provider.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["left", "right"]
observation_arms = []

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[completion]
return_home = true
home_tolerance_rad = 0.05

[task]
verbatim_instruction = true
prompt_source = "../prompts/feishu_english_20261014.json"
# Guided visual execution; common information boundaries are appended by BenchTask.
prompt_protocol = "guided_visual_l2_v3"
scoring_protocol = "native_l2_validity_v2"
id = "L2-03"
name = "双臂支撑并抽取中层书"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Native rigid closed books, 378.9 g each; no page flex. All books are dynamic. Support box anchored as a passive fixture. Friction uncalibrated."
launch_command = "python tools/launch.py run L2-03 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L2-03 --gui"
instruction = "Hold the top book steady with the right arm, then pull the middle book out 5 cm with the left arm and release it."

# 中文布置和道具说明。
description = """
参照真机图片：绿盒居中、较上一版向桌前移100 mm，中心(0.19565,1.20)m；三本书平叠，整体相对盒心向画面右侧偏35 mm、向机械臂侧偏20 mm，左侧和前侧露出盒面。每本220×140×19.6 mm、378.9 g。中层再向画面右侧突出40 mm，右臂夹突出边向右抽，左臂扶上书。盒子固定，三本书均可动；向右再抽至少20 mm，允许相邻书轻微随动，不要求完全抽离。抽后书本仍有书堆/盒面承托，全部松手。
所有道具按要求释放，并且双臂回到初始关节位置，才算完成；关节回位容差0.05 rad。不自动执行回位。资产来源：飞书《GPT6评测任务及资产管理》2026-10-11下载包。
"""
