当前实现：已接入本地物理场景、共用 GPT 控制流程、独立评分及记录。参数为仿真工程值，需按实物校准；启动命令见本任务 launch_command。
范围：保留当前已接入的仿真配置与英文 prompt；本轮不替换螺丝、孔座、动作流程或评分定义。
道具：现有橙色粗螺丝、固定蓝色螺纹孔座和操作台；螺丝芯径约 26 mm、牙外径约 36 mm、头部直径约 44 mm、总高约 60 mm，右旋螺距 12 mm。
布置：螺丝平底直立在桌面，孔座单独固定，二者分开放置、不预先啮合、不预抓持。左臂操作，右臂可按需移动相机观察。
操作：自主抓住螺丝头、抬起、搬运对准、首次啮合，然后协调顺时针旋转与向下推进，必要时重抓，最后松手让孔座承托。
完成：沿用现有净旋转、有效推进、入孔深度及释放稳定判据；任务阈值和本轮之前修正的评分逻辑不变。
边界：这是粗牙简化接触任务，未模拟或验证滑牙、材料损伤和真实紧固扭矩；不能将其解释为标准紧固件验收。
