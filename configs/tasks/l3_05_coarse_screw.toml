# Run in the Isaac Sim environment, using the configured shared model transport.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["left", "right"]
observation_arms = []

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[runtime]
# Fine SDF thread contact uses 1920 Hz; new geometry needs runtime qualification, only this task overrides the shared step.
physics_dt_s = 0.0005208333333333333

[policy]
model_config = "../models/gpt.toml"

[completion]
return_home = true
home_tolerance_rad = 0.05

[task]
id = "L3-05"
name = "绿盒横置螺杆双臂旋下螺母"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "loose_nut"
launch_command = "python tools/launch.py run L3-05 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-05 --gui"
instruction = """
The 140 mm silver stud lies horizontally on the green box centre between both arms, body toward image-left and 24 mm hex nut toward image-right. LEFT picks and holds the 14 mm smooth shaft; RIGHT pinches the nut flats and unscrews counterclockwise viewed from the exposed threaded end. Lift clear of the box before bringing the second hand in. Nut thickness 13 mm, 2 mm pitch, approximately 2.5 turns remain. Use actual relative movement, not whole-assembly rotation, to check progress. Once fully detached, place both parts safely on the box or table and release.

Use current RGB views and measured robot feedback. First identify the objects and make a short plan, then execute and verify each physical subgoal. If an object did not follow the gripper, correct the grasp before continuing. Reobserve after contact; do not infer success from a commanded pose. There is no automatic grasp, reset, release or return-home action. The common completion instructions appended below are mandatory.
"""

# Chinese setup and props; final task attribute.
description = """
新版锥尾螺杆长140 mm、螺距2 mm，螺母对边24 mm/厚13 mm；主体约185.6 g，螺母约32.1 g。横置于两臂正中间的绿盒凹面，主体朝画面左侧、螺母朝右；左臂拿主体，右臂旋螺母。初态沿真实螺旋预松14 mm/7圈，保留约5 mm啮合；新资产SDF螺纹接触，不加螺旋关节。完全旋离后两部分放到盒面或桌面并释放。
所有道具按要求释放，并且双臂回到初始关节位置，才算完成；关节回位容差0.05 rad。不自动执行回位。资产来源：飞书《GPT6评测任务及资产管理》2026-10-11下载包。
"""
