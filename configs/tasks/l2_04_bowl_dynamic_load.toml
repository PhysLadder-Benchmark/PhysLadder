# Run from the repository root in the Isaac Sim environment; uses the selected model provider.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_tuojing_lab.toml"
active_arms = ["left", "right"]
observation_arms = []

[simulation]
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [0.21354960845762927, 0.48765041712220114, 1.32]
camera_target = [0.1643434123515941, 1.0254038459952994, 0.78]

[policy]
model_config = "../models/gpt.toml"

[runtime]
physics_dt_s = 0.004166666666666667 # 240 Hz; native CCD retained for rigid contents.

[task]
# Guided RGB-D execution; common information boundaries are appended by BenchTask.
prompt_protocol = "guided_rgbd_l2_v2"
scoring_protocol = "native_l2_validity_v2"
id = "L2-04"
name = "满载小珍珠的碗搬运"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Native bowl and 8 mm pearls; explicit blue R5 grasp tabs add 16 g. Pearl outer-sphere collision and friction 0.03 are declared transport overrides; native visual bore remains. No fluids."
launch_command = "python tools/launch.py run L2-04 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L2-04 --gui"
instruction = """
Use BOTH R5 arms to transport the preloaded cream-coloured bowl to the green
patch. The small white contents are separate 8 mm pearls, already in the bowl;
there is no feeder or extra loading phase. The bowl is 140 mm across and 54 mm
high. The pearls can roll and slide, with low contact friction in this task.

The native bowl has thin walls that cannot be pinched by the configured R5
minimum opening. TWO BLUE grasp tabs are explicitly attached to its exterior
for this test. Use the LEFT hand on the -X-side tab and RIGHT on the +X-side tab.
Each tab is 40 x 45 x 20 mm; pinch across its 45 mm extent along world Y.
Do not grip across the entire bowl diameter or insert fingers into the contents.
Inspect both grasps and keep the two wrists/cameras clear of each other.

Establish both grips before lifting. Close in separate controlled steps and
verify the actual tabs lie between opposing pads. Raise the two sides in small,
matched increments and confirm the bowl follows without sliding. Keep the rim
approximately level; moving only one side substantially may spill the contents.

Carry toward the green patch with short, smooth movements, checking the bowl
and pearls after each. Correct tilt before continuing. Maintain enough clearance
above the table, and avoid abrupt starts, stops, or one-hand release in the air.
Both arms participate in manipulation; neither is assigned as an observation-only
arm. Use current images and measured robot feedback rather than assuming that
two commanded TCP positions imply a supported, level bowl.

Lower the bowl onto the green patch, then open and withdraw both hands without
knocking the rim. The bowl centre should be within 35 mm of the patch centre.
Completion requires an actual lifted transport, released upright tabletop
support and all pearls contained below the rim, nearly stationary for about
half a simulation second. A confirmed spill lasting 0.25 simulation seconds terminates the episode;
it is not recovered by continuing transport or returning a pearl.
Do not request stop while still holding the bowl or before it reaches the patch.
No automatic reset, hidden attachment, or scripted transport is provided.
"""

# 中文布置和道具说明。
description = """
道具：L20 开口碗（口径 140 mm、高 54 mm、原质量 120 g）与原生 8 mm 带孔小珍珠；实际粒数随任务布局自动记录。碗外加两块蓝色 R5 抓持片，共增加 16 g，明确属于抓持适配。
布置：拓境实验室桌上预先装填多层珍珠，碗口保留少量余量；目标绿区距离初始中心 120 mm。双臂分别夹左右外侧抓持片，不能夹薄碗壁或跨整个碗口。
操作与完成：双臂平稳抬起、搬运、落桌后释放，目标中心误差不超过 35 mm；所有珍珠保留在碗内，释放后约 0.5 秒。洒出证据持续 0.25 秒即结束本回合，并保留抬碗等阶段进展。
物理：保留碗原生碰撞体及珍珠外观、尺寸、质量；珍珠仅将珠孔碰撞简化为外球面，适用于搬运，不适用于穿珠任务；珍珠摩擦明确覆盖为 0.03，满足低摩擦负载任务。采用 240 Hz 物理步长；评分按原生分段碗腔，不能套旧圆锥碗。无流体模型。
"""
