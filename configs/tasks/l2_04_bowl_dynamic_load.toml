# Run from the repository root in the Isaac Sim environment; requires OPENAI_API_KEY.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_bimanual_sim.toml"
active_arms = ["left", "right"]

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.6, 0.0, 1.4]
camera_target = [0.28, 0.0, 0.20]

[policy]
model_config = "../models/gpt.toml"

[execution]
retry_failed_attempts = true

[task]
id = "L2-04"
name = "持碗动态固体负载保持"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented"
implementation = "household"
simulation_limitations = "Engineering dimensions and friction; not calibrated to physical props."
launch_command = "python tools/launch.py run L2-04 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L2-04 --gui"
instruction = """
Both R5 arms may manipulate the props; neither is restricted to observation.
Use the overview and both wrist-camera views. Choose grasp points, poses and
motion from current observations and available robot feedback. Verify that
objects actually follow the grippers before transport. Plan motions that keep
the hands and held props clear of one another.
Pick up the receiving bowl and hold it steadily at the visible loading
location while an external standardized feeder adds rigid particles. The feeder
is part of the environment; do not invent a robot pouring action or operate its
control. The bowl initially rests on the table and is not pregrasped.
Use both hands to grasp the two handles securely, leaving
the opening unobstructed. Lift, verify the grasp, keep the bowl approximately
level and move it beneath the loading outlet. Once the loading phase begins,
maintain the primary support relationship while responding to changing load.
Use visible tilt, slip, particle motion and available feedback to adjust holding
pose, opening and support. Avoid abrupt acceleration, squeezing damage, moving
the bowl away mid-pour or losing particles over the rim. Do not chase particles
with the receiving hand while abandoning the bowl.
The prescribed load is six red rigid blocks. Use the latest images to confirm
all six are wholly inside the bowl; a block on the rim or tabletop is not contained.
After loading, keep BOTH hands holding the handles, the bowl clear of the table,
level and nearly still for at least 2.0 simulation seconds before placing it.
Then lower gently onto the table, open each gripper in a separate decision, and
verify the released bowl stays upright with all six blocks contained and still
for 1.0 simulation seconds. No live feeder-status sensor is provided: use images
and simulation timestamps rather than assuming a feeder-completed flag.
This first version uses rigid solid particles only; water is a later separate version.
Inspect the actual released or completed state before requesting stop. A
commanded pose, blocked gripper, or completion claim is not evidence of success.
If a grasp is lost or the scene resets, use new observations and reassess rather
than continuing with stale object positions. Do not invent force measurements
or assume a force-control tool that the interface does not expose.
"""

# Chinese setup/props description; keep this the final task attribute.
description = """
道具：蓝色双把手碗、灰色滑板加料器、六个 16 mm 红色刚性小块，每块 20 g、操作台。
布置：碗放在桌面，两手空手；小块在上方滑板上。双臂分别抓持两侧把手，将碗移到加料区。
操作：碗底约离桌 130 mm 且双手持稳后，环境加料器按固定节奏撤去滑板，约 3 秒内落料；模型负责持碗，不负责控制加料器。装满后持稳 2 秒，再放到桌面松手。
完成：全部六块留在碗内，负载保持和最终放下稳定，无洒出。
边界：只实现刚性固体负载，没有水；固定加料属于实验环境，不是脚本代替机器人执行任务。
"""
