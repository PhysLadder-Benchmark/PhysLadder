# Run in the Isaac Sim environment, using the configured shared model transport.
# launch_command / launch_command_conda below are documentation, not auto-executed shell code.
schema_version = 2
workflow_profile = "../workflows/gpt_default.toml"

[robot]
profile = "../robots/r5_video_20261015.toml"
active_arms = ["right", "left"]
observation_arms = []

[simulation]
# Preserve the established L3 controller profile. GPU selection is a launch option.
robot_gravity_compensation = false
cartesian_completion_tolerance_m = 0.005
environment = "tuojing_lab_v4"
camera_profile = "../cameras/r5_tuojing_lab.toml"
asset_directory = "../../build/tuojing_lab"
headless = true
width = 1280
height = 720
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0

[policy]
model_config = "../models/gpt.toml"

[completion]
return_home = false
home_tolerance_rad = 0.05

[task]
scene_delivery = "video_20261015"
prompt_protocol = "feishu_english_20261015_v1"
reference_document = "https://my.feishu.cn/docx/QK4EdOD3hotgp4x782ycgoyyn6g"
reference_sheet_id = "KyMjZ7"
reference_sheet_revision = 324
reference_sheet_row = 30
id = "L3-04"
variant_id = "L3-04_v3"
scene_variant = "L3-04_v3"
# Restore the original aligned stack and shift both books/rectangles together.
stacked_book_offset_x_m = -0.10
boundary_reference = "lower_book"
name = "双臂推叠书旋转360度移框"
execution_target = "simulation_and_real"
simulation_enabled = true
status = "implemented_proxy"
implementation = "household"
launch_command = "python tools/launch.py run L3-04_v3 --gui"
launch_command_conda = "conda run --no-capture-output -n isaac51 python tools/launch.py run L3-04_v3 --gui"
instruction = """
Use both grippers to push the two stacked books from one black rectangle to the other, rotating the stack one full turn along the way. Judge containment in the starting and target rectangles by the lower book only: the lower book must lie fully inside the rectangle; the upper book may overhang its boundary while remaining stacked and supported by the lower book. Keep both books stacked on the table without grasping or lifting them.
"""

# Chinese setup/props description; final task attribute.
description = """
双臂协作推叠书转移。两本书叠放在桌面的一个黑色矩形框内，另一个黑色矩形框为目标区域。左右臂使用夹爪共同推动整叠书，从起始框移至目标框，并在移动过程中使整叠书沿桌面旋转一整圈（360°）。全程保持两本书叠放且由桌面承托，禁止抓取或抬起。起始框和目标框的边界均以下层书的完整投影为准；上层书可伸出框边界，但必须保持叠放并由下层书承托。不要求居中或固定朝向。
"""

# Time-only experiment budget: zero disables the decision/request-count cap.
[runtime]
max_wall_time_s = 18000.0

[execution]
model_budget_basis = "completed_generations"
retry_model_errors = true
max_decisions = 150
