schema_version = 2

[task]
id = "GPT-PICK-PLACE"
instruction = """
Use only the {arm} R5 arm to pick up the red cube from the table and place it
at the centre of the green target patch. The other arm must remain still.
Determine the cube and target locations from the RGB views. Plan your own
approach, grasp, lift, transport, release and retreat using measured TCP poses
and execution feedback. Reobserve and correct alignment as needed. Use small
Cartesian moves near contact; IK alone does not guarantee a straight path.
Lift the cube at least {lift_threshold_m} metres above its initial height and
keep it securely lifted for at least {stability_s} simulation seconds before
placing it. Opening the gripper to {open_width_m} metres provides full clearance.
After release, withdraw the fingers and let the cube remain stably on the target
for at least {stability_s} simulation seconds. Empty commands wait with current
targets held. A gripper target may remain unreached when blocked by the cube;
use the images and feedback to distinguish contact from a missed grasp.
Do not push or drag the cube to substitute for picking it up. Request stop with
no commands only when you observe completion. Reconsider rejected targets using
the measured state and feedback; do not repeat an unreachable target unchanged.
"""

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left"]

[runtime]
seed = 0
max_steps = 2400
max_wall_time_s = 1800.0
physics_dt_s = 0.004166666666666667
control_dt_s = 0.08333333333333333

[observation]
cameras = ["overview", "left_wrist", "right_wrist"]
include_robot_state = true
include_feedback = true

[recording]
save_rgb = true
save_video = true

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
# Backend defaults to d3d12 on Windows and vulkan on Linux.
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.15, -1.3, 0.95]
camera_target = [0.28, 0.0, 0.20]

[interaction]
cube_size_m = 0.04
cube_mass_kg = 0.08
friction = 0.8
source_x_m = 0.38
transfer_y_m = 0.15
open_width_m = 0.070
lift_threshold_m = 0.07
placement_tolerance_m = 0.025
stability_s = 1.0

# Scoring thresholds; object/contact truth is never included in GPT observations.
contact_threshold_n = 0.05
placement_height_tolerance_m = 0.006
placement_speed_m_s = 0.02
placement_angular_speed_rad_s = 0.2
gripper_open_tolerance_m = 0.003
inactive_joint_tolerance_rad = 0.01

[execution]
max_action_steps = 120
completion_samples = 3
wait_steps = 12
settle_steps = 12
stop_steps = 12
max_decisions = 40
gripper_timing = "open_before_motion"
motion_mode = "cartesian_linear_v1"
startup_pose = "downward_ready_v1"
gripper_completion = "stall_aware_v1"

[policy]
model_config = "../models/gpt.toml"

[policy_options]
retain_text_history = true
operating_notes = true
action_interface = "sparse_eef"
camera_calibration = false
visual_aids = false
