pose_source = "Bracket mounting face and user installation video 20260927-190354.mp4; original bracket CAD axes provisionally aligned with right R5 link6. Optical centre estimated 14 mm forward of housing centre; image right along link -Y. Same local mount on both arms; not hand-eye calibrated."
asset = "../../assets/cameras/gemini305_r5_mounted.usda"
