schema_version = 2

[task]
id = "R5-CAMERAS"
instruction = "Verify RGB-D buffers, pixel backprojection, GPT input assembly and both wrist camera mounts."

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left", "right"]

[runtime]
seed = 0
max_steps = 1200
max_wall_time_s = 600.0
physics_dt_s = 0.004166666666666667
control_dt_s = 0.08333333333333333

[observation]
cameras = ["overview", "left_wrist", "right_wrist"]
include_robot_state = true
include_feedback = true
include_depth = true

[recording]
save_rgb = true
save_depth = true

[policy_options]
camera_calibration = true

[simulation]
environment = "lab_room_v1"
robot_appearance = "r5_black_silver_v1"
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.15, -1.3, 0.95]
camera_target = [0.28, 0.0, 0.20]

[interaction]
cube_size_m = 0.04
cube_mass_kg = 0.08
friction = 0.8
source_x_m = 0.38
transfer_y_m = 0.15
grasp_tcp_z_m = 0.033
approach_z_m = 0.18
lift_z_m = 0.15
closed_width_m = 0.028
open_width_m = 0.070
waypoint_spacing_m = 0.015
lift_threshold_m = 0.07
placement_tolerance_m = 0.025
stability_s = 1.0
