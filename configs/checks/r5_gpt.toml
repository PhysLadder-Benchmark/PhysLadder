schema_version = 2

[task]
id = "R5-GPT"
instruction = "Integration check only. Use the {arm} R5 arm. First move its TCP {lift_delta_m} metres upward along world Z from its initial measured pose, retaining X/Y and orientation. After movement completes, open the {arm} gripper to {gripper_width_m} metres. Observe the execution feedback before each next decision. When both are achieved, request_stop=true with no commands. Keep the other arm still. Do not touch the cube or table."

[robot]
profile = "../robots/r5_sim.toml"
active_arms = ["left", "right"]

[runtime]
seed = 0
max_steps = 1200
max_wall_time_s = 600.0
physics_dt_s = 0.004166666666666667
control_dt_s = 0.08333333333333333

[observation]
cameras = ["overview", "left_wrist", "right_wrist"]
include_robot_state = true
include_feedback = true

[recording]
save_rgb = true

[simulation]
camera_profile = "../cameras/r5_orbbec_provisional.toml"
asset_directory = "../../build/r5"
headless = true
graphics_backend = "d3d12"
width = 640
height = 480
fps = 12
arm_stiffness = 1500.0
arm_damping = 80.0
finger_stiffness = 2000.0
finger_damping = 40.0
self_collision = false
solver_position_iterations = 32
solver_velocity_iterations = 0
camera_position = [1.15, -1.3, 0.95]
camera_target = [0.28, 0.0, 0.20]

[interaction]
cube_size_m = 0.04
cube_mass_kg = 0.08
friction = 0.8
source_x_m = 0.38
transfer_y_m = 0.15
grasp_tcp_z_m = 0.033
approach_z_m = 0.18
lift_z_m = 0.15
closed_width_m = 0.028
open_width_m = 0.070
waypoint_spacing_m = 0.015
lift_threshold_m = 0.07
placement_tolerance_m = 0.025
stability_s = 1.0

[gpt_check]
model_config = "../models/gpt.toml"

[execution]
max_action_steps = 120
completion_samples = 3
wait_steps = 12
settle_steps = 12
stop_steps = 0

[motion_goal]
arm = "left"
lift_delta_m = 0.02
gripper_width_m = 0.06
position_tolerance_m = 0.005
orientation_tolerance_rad = 0.02
gripper_tolerance_m = 0.002
inactive_joint_tolerance_rad = 0.01
