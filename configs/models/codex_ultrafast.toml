# Opt-in Codex ChatGPT profile for an account with GPT-6 Astra Ultrafast access.
# Speed and reasoning are independent. No API key is needed for this transport.
# base_url is unused by codex_cli. Existing default model profiles are unchanged.
[gpt]
transport = "codex_cli"
codex_bin = "codex"
base_url = "https://api.openai.com/v1"
model = "gpt-6-astra"
reasoning_effort = "medium"
service_tier = "ultrafast"
timeout_s = 2400.0
structured_output = true
history_steps = 2
max_calls = 100
image_max_edge = 768
