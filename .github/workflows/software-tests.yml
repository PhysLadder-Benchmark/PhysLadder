name: Cross-platform software tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python tools/verify_runtime_assets.py --check-git --usd
      - run: python tools/release/check_task_contract.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/launch.py list --checks
      - run: python tools/reproduce.py --suite all
