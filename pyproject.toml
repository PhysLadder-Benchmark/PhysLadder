[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-rich-robot-tasks"
version = "0.1.0"
description = "Paired sim-real contact-rich manipulation evaluation on the ARX R5"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<12", "scipy>=1.11,<2"]

[project.urls]
Homepage = "https://physladder-benchmark.github.io/PhysLadder/"
Repository = "https://github.com/PhysLadder-Benchmark/PhysLadder"
Issues = "https://github.com/PhysLadder-Benchmark/PhysLadder/issues"
Documentation = "https://github.com/PhysLadder-Benchmark/PhysLadder/blob/master/docs/release/INSTALL.md"

[project.optional-dependencies]
# CPU geometry/asset checks; Isaac and cuRobo remain separately configured runtimes.
test = ["usd-core>=25.5,<27", "trimesh>=4,<5", "rtree>=1,<2", "networkx>=3,<4"]

[project.scripts]
robot-tasks = "robot_tasks.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["robot_tasks*"]
namespaces = false
