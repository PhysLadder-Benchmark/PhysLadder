[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-rich-robot-tasks"
version = "0.1.0"
description = "Scaffold for complete contact-rich robot task episodes"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<12"]

[project.scripts]
robot-tasks = "robot_tasks.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["robot_tasks*"]
namespaces = false
